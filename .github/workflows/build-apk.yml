                  if (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise RuntimeError("Symlinks are not allowed in source archive")
              archive.extractall(Path.cwd())
              print(f"Restored {len(archive.infolist())} source files; SHA-256 71f0c6b78b90894e18dd82dfd486f2f8c9efe9606c382ea4ae33007f910a6893")
          PY
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r server/requirements.txt httpx playwright
      - name: Verify API and panel routes
        run: python -m unittest discover -s tests -v
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify mobile control panel
        run: python scripts/check-panel.py
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check matching, build APK and run Android Lint
        run: gradle -p android --no-daemon :core:check :app:assembleDebug :app:lintDebug
      - name: Save verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-auto-reply-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Save mobile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-panel-preview
          path: dist/panel-mobile.png
          if-no-files-found: ignore
          retention-days: 14
