      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify API and panel routes
        run: python -m unittest discover -s tests -v
      - name: Verify panel request ordering and session isolation
        run: node tests/test_panel_client.js
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify mobile control panel
        run: python scripts/check-panel.py
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Java rules and host regressions
        run: |
          sh scripts/check-core.sh
          bash android/app/host-tests/run.sh
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify matching, compile Android source and run Lint
        run: gradle -p android --no-daemon :core:check :app:compileDebugJavaWithJavac :app:lintDebug
      - name: Build APK after all checks passed
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Save verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-auto-reply-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Save mobile preview and browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-panel-preview
          path: |
            dist/panel-mobile.png
            dist/panel-failure.png
            dist/panel-trace.zip
            dist/panel-browser-errors.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Save exact verified project source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sms-auto-reply-source
          path: dist/sms-auto-reply-source.zip
          if-no-files-found: error
          retention-days: 14
